name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookeasy
          POSTGRES_PASSWORD: bookeasy
          POSTGRES_DB: bookeasy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookeasy"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bookeasy:bookeasy@localhost:5432/bookeasy
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-access-secret-change-me-32chars-minimum
      REFRESH_TOKEN_SECRET: ci-refresh-secret-change-me-32chars-minimum
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
