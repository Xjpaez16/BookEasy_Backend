services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookeasy
      POSTGRES_PASSWORD: bookeasy
      POSTGRES_DB: bookeasy
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookeasy']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://bookeasy:bookeasy@db:5432/bookeasy
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: dev-access-secret-change-me-32chars-min
      REFRESH_TOKEN_SECRET: dev-refresh-secret-change-me-32chars-min
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - '3000:3000'

  worker:
    build: .
    command: ['bun', 'run', 'src/worker.ts']
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://bookeasy:bookeasy@db:5432/bookeasy
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: dev-access-secret-change-me-32chars-min
      REFRESH_TOKEN_SECRET: dev-refresh-secret-change-me-32chars-min
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REMINDER_POLL_MS: '15000'
      REMINDER_BATCH: '50'

volumes:
  db_data:
